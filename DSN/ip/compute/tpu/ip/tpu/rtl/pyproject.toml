[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-tpu"
version = "0.1.0"
description = "Educational TPU: 8x8 systolic array, INT8 precision, 16-instruction ISA"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Jaber Jaber", email = "jaber@rightnowai.co"}
]
keywords = ["tpu", "systolic-array", "neural-network", "hardware", "verilog", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware",
]
dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "cocotb>=1.8.0",
    "cocotb-bus>=0.2.1",
    "black>=23.0.0",
]
pytorch = [
    "torch>=2.0.0",
]
docs = [
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
]
all = [
    "tiny-tpu[dev,pytorch,docs]",
]

[project.urls]
Homepage = "https://rightnowai.co"
Documentation = "https://github.com/RightNow-AI/tiny-tpu#readme"
Repository = "https://github.com/RightNow-AI/tiny-tpu"
Issues = "https://github.com/RightNow-AI/tiny-tpu/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["tiny_tpu*"]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
